name: Deploy Backend to DigitalOcean

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
  workflow_dispatch:

jobs:
  test:
    name: Preparing deployment
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        continue-on-error: false

      - name: Run linter
        run: npm run lint || true

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test || true

  deploy:
    name: Deploy to DigitalOcean
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Build application
        run: npm ci && npm run build

      - name: Deploy to DigitalOcean via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          script: |
            # Monorepo setup: Clone to temp location, then copy only server directory
            REPO_DIR="/tmp/right-care-finder-repo"
            APP_DIR="/var/www/right-care-finder-api"
            
            # Clone or update the repository
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
            git fetch origin
            git reset --hard origin/main
            else
              rm -rf "$REPO_DIR"
              git clone https://github.com/RogueDevTech/right-care-finder.git "$REPO_DIR"
              cd "$REPO_DIR"
              git checkout main
            fi
            
            # Verify server directory exists in repo
            if [ ! -d "$REPO_DIR/server" ]; then
              echo "Error: server directory not found in repository"
              exit 1
            fi
            
            # Copy only the server directory contents to app directory
            mkdir -p "$APP_DIR"
            
            # Remove any nested right-care-finder directory that might exist (prevents rsync error)
            if [ -d "$APP_DIR/right-care-finder" ]; then
              echo "Removing nested right-care-finder directory..."
              rm -rf "$APP_DIR/right-care-finder"
            fi
            
            # Remove .npmrc if it exists (might have production-only config)
            if [ -f "$APP_DIR/.npmrc" ]; then
              echo "Removing .npmrc file that might force production-only installs..."
              rm -f "$APP_DIR/.npmrc"
            fi
            
            rsync -av --delete "$REPO_DIR/server/" "$APP_DIR/" --exclude='.git' --exclude='node_modules' --exclude='dist'
            
            # Verify package.json was copied
            if [ ! -f "$APP_DIR/package.json" ]; then
              echo "Error: package.json not found after rsync"
              ls -la "$APP_DIR"
              exit 1
            fi
            
            # Navigate to app directory
            cd "$APP_DIR"
            
            # Create .env file from GitHub Secrets (automatically handles .env creation)
            cat > .env << EOF
            NODE_ENV=production
            PORT=${{ secrets.PORT || 4001 }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT || 5432 }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_SSL=${{ secrets.DB_SSL || true }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            TYPEORM_LOGGING=${{ secrets.TYPEORM_LOGGING || false }}
            SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
            SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL }}
            SENDGRID_FROM_NAME=${{ secrets.SENDGRID_FROM_NAME }}
            EOF
            chmod 600 .env
            
            # Install ALL dependencies (including dev dependencies needed for build)
            # The nest CLI is in devDependencies and is required for building
            echo "Installing dependencies (including dev dependencies for build)..."
            # Clear any npm config that might force production-only installs
            npm config delete only 2>/dev/null || true
            npm config delete omit 2>/dev/null || true
            # Verify config is cleared
            echo "NPM config check:"
            npm config get only || echo "  'only' config not set (good)"
            # npm ci includes dev dependencies by default (no flag needed)
            # If npm ci fails, fall back to npm install (also includes dev by default)
            npm ci || npm install
            
            # Build application (requires @nestjs/cli from devDependencies)
            echo "Building application..."
            npm run build
            
            # Verify build succeeded
            if [ ! -f "dist/main.js" ]; then
              echo "Error: Build failed - dist/main.js not found"
              ls -la dist/ || echo "dist directory does not exist"
              exit 1
            fi
            
            # Create logs directory if it doesn't exist
            mkdir -p logs
            
            # Test database connection before starting app (using GitHub secrets directly)
            echo "Testing database connection..."
            export DB_HOST="${{ secrets.DB_HOST }}"
            export DB_PORT="${{ secrets.DB_PORT || 5432 }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export DB_DATABASE="${{ secrets.DB_DATABASE }}"
            export DB_SSL="${{ secrets.DB_SSL || true }}"
            node -e "
              const { Client } = require('pg');
              const useSSL = process.env.DB_SSL !== 'false';
              const client = new Client({
                host: process.env.DB_HOST,
                port: parseInt(process.env.DB_PORT || '5432'),
                user: process.env.DB_USERNAME,
                password: process.env.DB_PASSWORD,
                database: process.env.DB_DATABASE,
                ssl: useSSL ? { rejectUnauthorized: false } : false
              });
              client.connect()
                .then(() => {
                  console.log('✅ Database connection successful');
                  return client.query('SELECT NOW()');
                })
                .then((res) => {
                  console.log('Database time:', res.rows[0].now);
                  client.end();
                  process.exit(0);
                })
                .catch((err) => {
                  console.error('❌ Database connection failed:', err.message);
                  console.error('Connection details:', {
                    host: process.env.DB_HOST,
                    port: process.env.DB_PORT,
                    user: process.env.DB_USERNAME,
                    database: process.env.DB_DATABASE,
                    ssl: useSSL
                  });
                  client.end();
                  process.exit(1);
                });
            " || {
              echo "⚠️  Database connection test failed, but continuing deployment..."
              echo "Check your database credentials and network connectivity"
            }
            
            # Run migrations
            echo "Running migrations..."
            npm run migration:run || echo "No migrations to run"
            
            # Start or restart PM2
            echo "Starting application with PM2..."
            if pm2 list | grep -q "right-care-finder-api"; then
              echo "Restarting existing PM2 process..."
              pm2 restart right-care-finder-api
            else
              echo "Starting new PM2 process..."
              pm2 start deploy/ecosystem.config.js
            fi
            
            # Verify PM2 started successfully
            sleep 2
            if ! pm2 list | grep -q "right-care-finder-api"; then
              echo "Error: PM2 process not found after start"
              pm2 logs right-care-finder-api --lines 50 || echo "No logs available"
              exit 1
            fi
            
            pm2 save
            pm2 status

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          script: |
            echo "Checking PM2 status..."
            pm2 status
            
            echo "Checking if process exists..."
            if ! pm2 list | grep -q "right-care-finder-api"; then
              echo "❌ PM2 process not found"
              exit 1
            fi
            
            # Check if process is online by parsing pm2 list output (status is in column 9)
            PM2_STATUS=$(pm2 list | grep "right-care-finder-api" | awk '{print $9}' || echo "unknown")
            echo "PM2 process status from list: $PM2_STATUS"
            pm2 info right-care-finder-api
            
            # Check if process is stopped or errored, restart if needed
            if [ "$PM2_STATUS" != "online" ]; then
              echo "⚠️  Process is not online (status: $PM2_STATUS). Checking error logs..."
              echo "=== Error Logs ==="
              pm2 logs right-care-finder-api --err --lines 50 --nostream || echo "No error logs available"
              echo "=== Output Logs ==="
              pm2 logs right-care-finder-api --out --lines 50 --nostream || echo "No output logs available"
              
              echo "Attempting to restart the process..."
              cd /var/www/right-care-finder-api
              pm2 restart right-care-finder-api || pm2 start deploy/ecosystem.config.js
              echo "Waiting for process to start..."
              sleep 5
            fi
            
            # Wait for process to be online (check status multiple times)
            MAX_ATTEMPTS=12
            ATTEMPT=0
            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              CURRENT_STATUS=$(pm2 list | grep "right-care-finder-api" | awk '{print $9}' || echo "unknown")
              if [ "$CURRENT_STATUS" = "online" ]; then
                echo "✅ Process is now online"
                break
              fi
              ATTEMPT=$((ATTEMPT + 1))
              echo "Waiting for process to start... (attempt $ATTEMPT/$MAX_ATTEMPTS, status: $CURRENT_STATUS)"
              sleep 5
            done
            
            # Final status check
            FINAL_STATUS=$(pm2 list | grep "right-care-finder-api" | awk '{print $9}' || echo "unknown")
            if [ "$FINAL_STATUS" != "online" ]; then
              echo "❌ Process failed to start. Final status: $FINAL_STATUS"
              echo "=== Recent Error Logs ==="
              pm2 logs right-care-finder-api --err --lines 50 --nostream || echo "No error logs available"
              echo "=== Recent Output Logs ==="
              pm2 logs right-care-finder-api --out --lines 50 --nostream || echo "No output logs available"
              exit 1
            fi
            
            echo "Recent application logs:"
            pm2 logs right-care-finder-api --lines 30 --nostream || echo "No logs available"
            
            echo "Waiting a bit more for application to fully initialize..."
            sleep 5
            
            echo "Testing API endpoint..."
            curl -f http://localhost:4001/api || {
              echo "❌ API endpoint not responding"
              echo "Checking if port is listening..."
              ss -tlnp | grep 4001 || echo "Port 4001 not listening"
              echo ""
              echo "=== Recent Error Logs ==="
              pm2 logs right-care-finder-api --err --lines 30 --nostream || echo "No error logs available"
              echo "=== Recent Output Logs ==="
              pm2 logs right-care-finder-api --out --lines 30 --nostream || echo "No output logs available"
              exit 1
            }
            
            echo "✅ Deployment verified successfully"
