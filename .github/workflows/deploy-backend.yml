name: Deploy Backend to DigitalOcean

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
  workflow_dispatch:

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        continue-on-error: false

      - name: Run linter
        run: npm run lint || true

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test || true

  deploy:
    name: Deploy to DigitalOcean
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Build application
        run: npm ci && npm run build

      - name: Deploy to DigitalOcean via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          script: |
            # Monorepo setup: Clone to temp location, then copy only server directory
            REPO_DIR="/tmp/right-care-finder-repo"
            APP_DIR="/var/www/right-care-finder-api"
            
            # Clone or update the repository
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
            git fetch origin
            git reset --hard origin/main
            else
              rm -rf "$REPO_DIR"
              git clone https://github.com/RogueDevTech/right-care-finder.git "$REPO_DIR"
              cd "$REPO_DIR"
              git checkout main
            fi
            
            # Verify server directory exists in repo
            if [ ! -d "$REPO_DIR/server" ]; then
              echo "Error: server directory not found in repository"
              exit 1
            fi
            
            # Copy only the server directory contents to app directory
            mkdir -p "$APP_DIR"
            
            # Remove any nested right-care-finder directory that might exist (prevents rsync error)
            if [ -d "$APP_DIR/right-care-finder" ]; then
              echo "Removing nested right-care-finder directory..."
              rm -rf "$APP_DIR/right-care-finder"
            fi
            
            # Remove .npmrc if it exists (might have production-only config)
            if [ -f "$APP_DIR/.npmrc" ]; then
              echo "Removing .npmrc file that might force production-only installs..."
              rm -f "$APP_DIR/.npmrc"
            fi
            
            rsync -av --delete "$REPO_DIR/server/" "$APP_DIR/" --exclude='.git' --exclude='node_modules' --exclude='dist'
            
            # Verify package.json was copied
            if [ ! -f "$APP_DIR/package.json" ]; then
              echo "Error: package.json not found after rsync"
              ls -la "$APP_DIR"
              exit 1
            fi
            
            # Navigate to app directory
            cd "$APP_DIR"
            
            # Create .env file from GitHub Secrets (automatically handles .env creation)
            cat > .env << EOF
            NODE_ENV=production
            PORT=${{ secrets.PORT || 4001 }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT || 5432 }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            TYPEORM_LOGGING=${{ secrets.TYPEORM_LOGGING || false }}
            EOF
            chmod 600 .env
            
            # Install ALL dependencies (including dev dependencies needed for build)
            # The nest CLI is in devDependencies and is required for building
            echo "Installing dependencies (including dev dependencies for build)..."
            # Clear any npm config that might force production-only installs
            npm config delete only 2>/dev/null || true
            npm config delete omit 2>/dev/null || true
            # Verify config is cleared
            echo "NPM config check:"
            npm config get only || echo "  'only' config not set (good)"
            # npm ci includes dev dependencies by default (no flag needed)
            # If npm ci fails, fall back to npm install (also includes dev by default)
            npm ci || npm install
            
            # Build application (requires @nestjs/cli from devDependencies)
            echo "Building application..."
            npm run build
            
            # Verify build succeeded
            if [ ! -f "dist/main.js" ]; then
              echo "Error: Build failed - dist/main.js not found"
              ls -la dist/ || echo "dist directory does not exist"
              exit 1
            fi
            
            # Create logs directory if it doesn't exist
            mkdir -p logs
            
            # Run migrations
            echo "Running migrations..."
            npm run migration:run || echo "No migrations to run"
            
            # Start or restart PM2
            echo "Starting application with PM2..."
            if pm2 list | grep -q "right-care-finder-api"; then
              echo "Restarting existing PM2 process..."
              pm2 restart right-care-finder-api
            else
              echo "Starting new PM2 process..."
              pm2 start deploy/ecosystem.config.js
            fi
            
            # Verify PM2 started successfully
            sleep 2
            if ! pm2 list | grep -q "right-care-finder-api"; then
              echo "Error: PM2 process not found after start"
              pm2 logs right-care-finder-api --lines 50 || echo "No logs available"
              exit 1
            fi
            
            pm2 save
            pm2 status

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          script: |
            echo "Checking PM2 status..."
            pm2 status
            
            echo "Checking if process is running..."
            if pm2 list | grep -q "right-care-finder-api"; then
              echo "✅ PM2 process found"
              pm2 info right-care-finder-api
              echo "Recent logs:"
              pm2 logs right-care-finder-api --lines 20 --nostream || echo "No logs available"
            else
              echo "❌ PM2 process not found"
              exit 1
            fi
            
            echo "Waiting for application to start..."
            sleep 5
            
            echo "Testing API endpoint..."
            curl -f http://localhost:4001/api || {
              echo "❌ API endpoint not responding"
              echo "Checking if port is listening..."
              netstat -tlnp | grep 4001 || ss -tlnp | grep 4001 || echo "Port 4001 not listening"
              exit 1
            }
            
            echo "✅ Deployment verified successfully"
